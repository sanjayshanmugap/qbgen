version: '3.8'

services:
  # Landing page (Next.js)
  landing:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    networks:
      - qbgen-network

  # Backend (Flask) - serves both API and frontend
  backend:
    build:
      context: ../
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - FLASK_ENV=production
    networks:
      - qbgen-network

networks:
  qbgen-network:
    driver: bridge 